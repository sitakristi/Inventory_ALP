<header class="topbar">
    <div class="topbar-left">
        <i class="fa-solid fa-bars menu-toggle" id="menuToggle"></i>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass text-muted"></i>
            <input type="text" placeholder="Cari data transaksi atau barang...">
        </div>
    </div>
    <div class="topbar-right">
        <button class="icon-btn" id="themeToggle" title="Toggle Dark Mode">
            <i class="fa-solid fa-moon"></i>
        </button>
        <button class="icon-btn"><i class="fa-solid fa-bell"></i></button>
        <img src="https://ui-avatars.com/api/?name=Admin+User&background=3b82f6&color=fff" alt="Profile" class="profile-pic">
        <button class="icon-btn" id="btnLogout" title="Logout" style="color: #ef4444; margin-left: 10px;">
            <i class="fa-solid fa-right-from-bracket"></i>
        </button>
    </div>
</header>
